name: BLACKOUT CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Android Application CI: Java/XML, Room, Unit Tests, and Debug Build
  # =========================================================================
  android-build-and-test:
    name: Android App (Build & Test)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest --continue --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Android Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blackout-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # =========================================================================
  # 2. Operations Portal CI: React, TypeScript, Vitest, and Production Bundle
  # =========================================================================
  web-portal-build-and-test:
    name: Web Operations Portal (Build & Test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        run: npm ci

      - name: Run Web Unit Tests (Vitest)
        run: npm test

      - name: Typecheck and Build Web Portal (Vite)
        run: npm run build

      - name: Upload Web Production Bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blackout-operations-portal-dist
          path: web/dist/
          retention-days: 14
